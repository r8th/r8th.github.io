<html lang="en">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Ryan O'Grady — 3D Environment Artist. Ringling College of Art & Design, Game Art 2026.">
  <meta name="keywords" content="3D, environment art, Maya, Unreal Engine, UE5, game art, Ryan O'Grady, Ringling College">
  <title>Ryan O'Grady — 3D Environment Artist</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">

  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
</head>
<body>

  <div id="navbar"></div>

    <script>
      $(document).ready(function() {
        $("#navbar").load("navbar.html");
      });
    </script>
  
  <!-- ══════════════════════════
       HOME PAGE
  ══════════════════════════ -->
  <div id="page-home" class="page active">

    <!--
    ═══════════════════════════════════════════════════════════════════
    PROJECT THUMBNAILS
    To add a new project:
      1. Copy one project-card block below and paste it inside works-grid.
      2. Change data-project="yourid" to a unique ID (no spaces).
      3. Update the img src, title, and meta text.
      4. Add a matching entry in the PROJECTS object in the <script>.
    ═══════════════════════════════════════════════════════════════════
    -->
    <div class="works-wrap">
      <div class="works-header">
        <h3 class="works-header-title">Environment Art</h3>
        <p class="works-header-sub">These are my most recent environment pieces</p>
      </div>
    <div class="works-grid">

      <!-- Project 1 — Dungeon Crawl -->
      <div class="project-card" data-page="project" id="dungeoncrawl" role="button" tabindex="0"
           aria-label="View Dungeon Crawl project">
        <img src="assets/Projects/dungeoncrawl/SS_01_Lit.jpg"
             alt="Dungeon Crawl — dark stone environment with moody lighting"
             loading="eager">
        <div class="project-card-overlay">
          <div class="project-card-title">Dungeon Crawl</div>
          <div class="project-card-meta">2026 · Unreal Engine 5</div>
        </div>
        <div class="project-card-arrow">→</div>
      </div>

      <!-- Project 2 — Eastern White Pine Forest -->
      <div class="project-card" data-page="project" id="pineforest" role="button" tabindex="0"
           aria-label="View Eastern White Pine Forest project">
        <img src="assets/Projects/easternwhitepineforest/Biome_Day_01.png"
             alt="Eastern White Pine Forest — lush forested environment"
             loading="eager">
        <div class="project-card-overlay">
          <div class="project-card-title">Eastern White Pine Forest</div>
          <div class="project-card-meta">2025 · Unreal Engine 5</div>
        </div>
        <div class="project-card-arrow">→</div>
      </div>

    </div>
    </div>

    <div class="works-wrap">
      <div class="works-header">
        <h3 class="works-header-title">Tech Art</h3>
        <p class="works-header-sub">My technical art experiments</p>
      </div>
    <div class="works-grid">

      <!-- Tech Art — PCG Biome -->
      <div class="project-card" data-page="project" id="pcgbiome" role="button" tabindex="0"
           aria-label="View PCG Biome project">
        <img src="assets/Projects/pcgbiome/UE_08.jpg"
             alt="PCG Biome — procedural biome render"
             loading="eager">
        <div class="project-card-overlay">
          <div class="project-card-title">PCG Biome</div>
          <div class="project-card-meta">2026 · Unreal Engine 5</div>
        </div>
        <div class="project-card-arrow">→</div>
      </div>

      <!-- Tech Art — PCG Mesh Scatter -->
      <div class="project-card" data-page="project" id="vertexmat" role="button" tabindex="0"
           aria-label="View PCG Mesh Scatter project">
        <img src="assets/Projects/vertexmat/FinalShot.png"
             alt="PCG Mesh Scatter — procedural mesh placement"
             loading="eager">
        <div class="project-card-overlay">
          <div class="project-card-title">Vertex Paint Material</div>
          <div class="project-card-meta">2026 · Unreal Engine 5</div>
        </div>
        <div class="project-card-arrow">→</div>
      </div>

    </div>
    </div>

    <footer class="site-footer">
      <p>© 2026 Ryan O'Grady</p>
    </footer>
  </div>


  <script>
    $(".project-card").on("click", function(e) {
      window.location.href = e.currentTarget.id + ".html";
    })

  </script>
</body>
</html>
